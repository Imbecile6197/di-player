name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # GTK >= 4.14 and libadwaita >= 1.6 are required; Ubuntu runner images
  # (22.04/24.04) are too old, so build inside an Ubuntu 26.04 container.
  ubuntu:
    name: ubuntu
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev \
            libgtk-4-dev libadwaita-1-dev mpv
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          stage=di-player-ubuntu
          mkdir -p "$stage"/{bin,share/applications,share/icons/hicolor/scalable/apps,share/icons/hicolor/128x128/apps,scripts}
          cp target/release/di_player "$stage/bin/"
          cp resources/icons/hicolor/scalable/apps/com.alchymista.DiPlayer.svg "$stage/share/icons/hicolor/scalable/apps/"
          cp resources/icons/hicolor/128x128/apps/com.alchymista.DiPlayer.png "$stage/share/icons/hicolor/128x128/apps/"
          sed 's|^Exec=.*|Exec=di_player|; s|^Icon=.*|Icon=com.alchymista.DiPlayer|' \
            data/com.alchymista.DiPlayer.desktop > "$stage/share/applications/com.alchymista.DiPlayer.desktop"
          cp scripts/install.sh README.md LICENSE "$stage/"
          tar -czf di-player-ubuntu.tar.gz "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: di-player-ubuntu
          path: di-player-ubuntu.tar.gz

  fedora:
    name: fedora
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y gcc pkgconf-pkg-config openssl-devel \
            gtk4-devel libadwaita-devel mpv cargo rust git
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          stage=di-player-fedora
          mkdir -p "$stage"/{bin,share/applications,share/icons/hicolor/scalable/apps,share/icons/hicolor/128x128/apps,scripts}
          cp target/release/di_player "$stage/bin/"
          cp resources/icons/hicolor/scalable/apps/com.alchymista.DiPlayer.svg "$stage/share/icons/hicolor/scalable/apps/"
          cp resources/icons/hicolor/128x128/apps/com.alchymista.DiPlayer.png "$stage/share/icons/hicolor/128x128/apps/"
          sed 's|^Exec=.*|Exec=di_player|; s|^Icon=.*|Icon=com.alchymista.DiPlayer|' \
            data/com.alchymista.DiPlayer.desktop > "$stage/share/applications/com.alchymista.DiPlayer.desktop"
          cp scripts/install.sh README.md LICENSE "$stage/"
          tar -czf di-player-fedora.tar.gz "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: di-player-fedora
          path: di-player-fedora.tar.gz

  release-assets:
    if: github.event_name == 'release'
    needs: [ubuntu, fedora]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            di-player-ubuntu/di-player-ubuntu.tar.gz
            di-player-fedora/di-player-fedora.tar.gz
