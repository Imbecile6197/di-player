[package]
name = "di_player"
version = "0.1.0"
edition = "2021"
description = "Native GNOME player for DI.fm premium radio"
license = "GPL-3.0-or-later"
authors = ["Alchymista"]

[dependencies]
gtk4 = { version = "0.10", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.8", features = ["v1_6"] }
glib = "0.21"
gio = "0.21"
gdk4 = "0.10"
gdk-pixbuf = "0.21"
pango = "0.21"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
thiserror = "2"
anyhow = "1"
once_cell = "1"
dirs = "6"
ksni = { version = "0.3", features = ["blocking"] }
parking_lot = "0.12"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
